[settings]
experimental = true
minimum_release_age = "0d"
idiomatic_version_file_enable_tools = ["python", "node"]
env_shell_expand = true

[settings.age]
strict = false

[settings.npm]
package_manager = "bun"
shell_out = true

[settings.github]
enterprise_hosts = ["leadforensics.ghe.com"]

[settings.tool_update]
global_auto = true

[settings.self_update]
auto = true

[env]
MISE_YES = "1"
IS_SANDBOX = "1"
NODE_USE_SYSTEM_CA = "1"
UV_SYSTEM_CERTS = true
# Build project .venvs from a matching Python on PATH (normally mise's), not uv's own installs.
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

# pi env vars
ATLASSIAN_ALLOW_WRITES = "1"

[shell_alias]
vi = "hx"
vim = "hx"
nvim = "hx"
gs = "git status"
gd = "git diff"
cl = "claude"
ccl = "CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1 claude"

[wrappers.claude]
command = "doppler"
args = [
  "run",
  "--only-secrets",
  "CLAUDE_CODE_OAUTH_TOKEN",
  "--only-secrets",
  "EXA_API_KEY",
  "--project",
  "vault",
  "--config",
  "prd",
  "--",
  "claude",
]

[wrappers.pi]
command = "doppler"
args = [
  "run",
  "--only-secrets",
  "ATLASSIAN_API_TOKEN",
  "--only-secrets",
  "ATLASSIAN_API_USERNAME",
  "--only-secrets",
  "ATLASSIAN_BASE_URL",
  "--only-secrets",
  "LOGGLY_API_TOKEN",
  "--only-secrets",
  "LOGGLY_SUBDOMAIN",
  "--only-secrets",
  "EXA_API_KEY",
  "--project",
  "vault",
  "--config",
  "prd",
  "--",
  "pi",
]

[wrappers.twg]
command = "doppler"
args = [
  "run",
  "--only-secrets",
  "TWG_TOKEN",
  "--only-secrets",
  "TWG_USER",
  "--only-secrets",
  "TWG_SITE",
  "--project",
  "vault",
  "--config",
  "prd",
  "--",
  "twg",
]

[tool_alias]
node = "core:node"
bun = "core:bun"
python = "core:python"
kbtd = "pypi:git+https://github.com/thehumanworks/kbtd#uvx"

[tools]
age = "latest"
helix = "latest"
node = "24"
bun = "latest"
python = "latest"
gh = "latest"
kbtd = "latest"
doppler = "latest"
claude = "latest"
pi = "latest"
fd = "latest"
ripgrep = "latest"
herdr = "latest"
tmux = "latest"
twg = "latest"
"github:thehumanworks/wit" = "latest"
"github:thehumanworks/capnshell" = "latest"
hunk = "latest"
uv = "latest"
"github:tailscale/tailcat" = "latest"

[bootstrap.mise_shell_activate]
zsh = true
bash = true

[dotfiles]
# Git accepts a section and its first key on one line. Prepend the include so
# existing settings in the writable ~/.gitconfig still win.
"~/.config/git/mise-defaults" = { source = "dotfiles/git/config", mode = "copy" }
"~/.gitconfig/mise-defaults" = { line = "[include] path = ~/.config/git/mise-defaults", position = "prepend" }

# shell - path activation
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
# shell - bashrc activation in bash_profile
"~/.bash_profile/source-bashrc" = { block = '''
if [[ -f ~/.bashrc ]]; then
  source ~/.bashrc
fi
''' }

# claude - .claude.json (includes MCP Servers) and settings
"~/.claude.json" = { source = "dotfiles/claude/.claude.json", mode = "copy" }
"~/.claude/settings.json" = { source = "dotfiles/claude/settings.json", mode = "symlink" }
"~/.claude/hooks" = { source = "dotfiles/claude/hooks", mode = "symlink-each" }

# pi - settings and MCP servers
"~/.pi/agent/settings.json" = { source = "dotfiles/pi/agent/settings.json", mode = "symlink" }
"~/.pi/agent/mcp.json" = { source = "dotfiles/pi/agent/mcp.json", mode = "symlink" }
"~/.pi/agent/open-tui.json" = { source = "dotfiles/pi/agent/open-tui.json", mode = "symlink" }
