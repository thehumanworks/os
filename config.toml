[settings]
experimental = true
minimum_release_age = "24h"
idiomatic_version_file_enable_tools = ["python", "node"]
env_shell_expand = true

[settings.age]
strict = false

[settings.npm]
package_manager = "bun"
shell_out = true

[settings.github]
enterprise_hosts = ["leadforensics.ghe.com"]

[settings.tool_update]
global_auto = true

[settings.self_update]
auto = true

[env]
MISE_YES = "1"
IS_SANDBOX = "1"
NODE_USE_SYSTEM_CA = "1"
UV_SYSTEM_CERTS = true
# Build project .venvs from a matching Python on PATH (normally mise's), not uv's own installs.
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

# pi env vars
ATLASSIAN_ALLOW_WRITES = "1"

[shell_alias]
vi = "hx"
vim = "hx"
nvim = "hx"
gs = "git status"
gd = "git diff"
cl = "claude"
ccl = "CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1 claude"

[wrappers.claude]
command = "fnox"
args = [
  "run",
  "--only", "CLAUDE_CODE_OAUTH_TOKEN",
  "--only", "EXA_API_KEY",
  "--",
  "claude"
]

[wrappers.pi]
command = "fnox"
args = [
  "run",
  "--only", "ATLASSIAN_API_TOKEN",
  "--only", "ATLASSIAN_API_USERNAME",
  "--only", "ATLASSIAN_BASE_URL",
  "--only", "LOGGLY_API_TOKEN",
  "--only", "LOGGLY_SUBDOMAIN",
  "--only", "EXA_API_KEY",
  "--",
  "pi"
]

[wrappers.doppler]
command = "fnox"
args = [
  "run",
  "--only", "DOPPLER_TOKEN",
  "--",
  "doppler"
]

[wrappers.gh]
command = "bash"
args = ["{{ config_source | dirname }}/scripts/gh-fnox"]

[tool_alias]
node = "core:node"
bun = "core:bun"
python = "core:python"
kbtd = "pypi:git+https://github.com/thehumanworks/kbtd#uvx"

[tools]
age = "latest"
helix = "latest"
node = "24"
bun = "latest"
python = "latest"
gh = "latest"
kbtd = "latest"
doppler = "latest"
fnox = "latest"
claude = "latest"
pi = "latest"
fd = "latest"
ripgrep = "latest"
herdr = "latest"
tmux = "latest"
"github:thehumanworks/wit" = "latest"
"github:thehumanworks/capnshell" = "latest"
hunk = "latest"
uv = "latest"

[tasks.bootstrap]
description = "Configure Git defaults, identities, HTTPS rewrites and credential helpers"
env.BOOTSTRAP_CONFIG_DIR = "{{ config_source | dirname }}"
# Mise's native secret grants are unavailable in global bootstrap tasks.
run = '''
exec fnox --config "$BOOTSTRAP_CONFIG_DIR/dotfiles/fnox/config.toml" --if-missing error \
  exec --redact --only GIT_PERSONAL_NAME,GIT_PERSONAL_EMAIL,GIT_WORK_NAME,GIT_WORK_EMAIL \
  -- bash "$BOOTSTRAP_CONFIG_DIR/scripts/bootstrap-git"
'''

[bootstrap.packages]
git = { version = "latest", names = { winget = "Git.Git" } }

[bootstrap.mise_shell_activate]
zsh = true
bash = true

[dotfiles]
# shell - path activation
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
# shell - bashrc activation in bash_profile
"~/.bash_profile/source-bashrc" = { block = '''
if [[ -f ~/.bashrc ]]; then
  source ~/.bashrc
fi
'''}

# fnox - config symlink
"~/.config/fnox/config.toml" = { source = "dotfiles/fnox/config.toml", mode = "symlink" }

# claude - .claude.json (includes MCP Servers) and settings
"~/.claude.json" = { source = "dotfiles/claude/.claude.json", mode = "copy" }
"~/.claude/settings.json" = { source = "dotfiles/claude/settings.json", mode = "symlink" }
"~/.claude/hooks" = { source = "dotfiles/claude/hooks", mode = "symlink-each" }

# pi - settings and MCP servers
"~/.pi/agent/settings.json" = { source = "dotfiles/pi/agent/settings.json", mode = "symlink" }
"~/.pi/agent/mcp.json" = { source = "dotfiles/pi/agent/mcp.json", mode = "symlink" }
"~/.pi/agent/open-tui.json" = { source = "dotfiles/pi/agent/open-tui.json", mode = "symlink" }
